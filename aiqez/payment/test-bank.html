<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Փորձնական վճարում — AIQEZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="test-bank">
  <header class="top">
    <a class="logo" href="../" aria-label="AIQEZ գլխավոր">
      <span class="logo-mark">AIQEZ</span>
      <span class="logo-sub">Creative AI Studio</span>
    </a>
  </header>
  <div class="test-bank-banner" role="alert">
    <b>ՓՈՐՁՆԱԿԱՆ ՎՃԱՐՈՒՄ</b><br>
    Սա բանկի էջ չէ։ Իրական գումար չի գանձվում։ Քարտի տվյալներ մի՛ մուտքագրիր։
  </div>
  <main class="section pay-page">
    <div class="pay-card" aria-live="polite">
      <h1>Փորձնական բանկ</h1>
      <p class="muted">Այս էջը փոխարինում է բանկի վճարման էջին, մինչև բանկը տրամադրի միացման տվյալները։ Ընտրիր, թե ինչ արդյունք փորձարկել։</p>
      <dl class="summary-list" id="pay-details"></dl>
      <div class="pay-actions">
        <button class="btn btn-primary btn-wide" type="button" data-outcome="paid">Հաջող վճարում (փորձ)</button>
        <button class="btn btn-ghost btn-wide" type="button" data-outcome="declined">Ձախողված վճարում (փորձ)</button>
        <button class="btn btn-ghost btn-wide" type="button" data-outcome="cancelled">Չեղարկել</button>
      </div>
      <p class="err" id="pay-error"></p>
    </div>
  </main>
  <footer class="foot">
    <p><b>AIQEZ</b> Creative AI Studio</p>
  </footer>
  <script src="payment.js"></script>
</body>
</html>
